[project]
name = "gateway"
version = "0.1.0"
description = "Authenticated Gateway Proxy for Gemini Enterprise and Agent Runtime"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "google-auth>=2.35.0",
    "pydantic-settings>=2.5.0",
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
pythonpath = [".."]
