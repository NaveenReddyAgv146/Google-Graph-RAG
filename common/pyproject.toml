[project]
name = "common"
version = "0.1.0"
description = "Shared Knowledge Plane, Graph Models, and Utilities for Enterprise GraphRAG"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-cloud-spanner>=3.49.0",
    "google-cloud-storage>=2.19.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

